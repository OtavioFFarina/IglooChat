    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>IglooChat | Voz, Vídeo, Compartilhamento de Tela e Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('igloochat_theme');
          if (!t) {
            var a = localStorage.getItem('igloochat_appearance');
            if (a) {
              var parsed = JSON.parse(a);
              if (parsed && parsed.theme) t = parsed.theme;
            }
          }
          if (t) {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-discord-darkest text-discord-normal overflow-hidden select-none font-sans">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
